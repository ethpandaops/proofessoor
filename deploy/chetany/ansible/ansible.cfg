[defaults]
ansible_managed = Ansible managed. Don't change this file manually. Template info: {{{{ role_name + '/'+ (template_path | replace(playbook_dir,'')) }}}}
stdout_callback      = ansible.builtin.default
result_format        = yaml
inventory            = inventories/inventory.ini
roles_path           = vendor/roles/
collections_path     = vendor/collections
forks                = 50
timeout              = 60
retry_files_enabled  = False
host_key_checking    = False

# Persist facts locally so that they can be used within multiple runs
fact_caching            = jsonfile
# Keep facts forever
fact_caching_timeout    = 0
# Where to store the fact cache
fact_caching_connection = tmp/chetany/

[inventory]
enable_plugins = script, yaml, ini

[ssh_connection]
ssh_args   = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s
pipelining = true

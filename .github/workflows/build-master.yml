name: Build Master

# Every push to main publishes moving dev tags (never `latest`).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # attest, and authenticate to the image mirror
      attestations: write # attest
    uses: ./.github/workflows/_shared-build.yml
    with:
      ref: ${{ github.sha }}
      tags: '["main","unstable"]'
    secrets:
      IMAGE_MIRROR_URL: ${{ secrets.IMAGE_MIRROR_URL }}

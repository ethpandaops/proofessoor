name: Build Master

# Every push to main publishes moving dev tags (never `latest`).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_shared-build.yml
    with:
      ref: ${{ github.sha }}
      tags: '["main","unstable"]'
    secrets:
      IMAGE_MIRROR_URL: ${{ secrets.IMAGE_MIRROR_URL }}

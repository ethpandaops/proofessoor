[package]
name = "proofessoor"
version = "0.4.2"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Clientless execution-proof requestor for zkBoost"

[features]
# Optional OpenTelemetry tracing: exports spans over OTLP/gRPC when
# OTEL_EXPORTER_OTLP_ENDPOINT is set (unset, behavior is identical to a build
# without the feature). Crate majors track zkBoost so both services can share
# a collector setup.
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:tracing-opentelemetry",
  "zkboost-client/otel",
]

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
# Used only to decode beacon blocks fetched from the Beacon API. Since zkBoost
# v0.9.0 the wire types mirror execution-specs (via ere-guests) and carry no
# lighthouse dependency, so this pin is free to move: the explicit conversion
# in request.rs is what locks the wire encoding, guarded by its golden root
# test. Cargo.lock pins the exact unstable commit for reproducible builds.
lighthouse_types = { git = "https://github.com/sigp/lighthouse", branch = "unstable", package = "types" }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
opentelemetry = { version = "0.31", optional = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"], optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
reqwest = { version = "0.12", features = ["json"] }
reqwest-eventsource = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.32", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
# Keep both crates on the same source: zkboost-client re-exports these protocol
# types, and Cargo treats identical types from different Git sources as distinct.
# This revision is v0.9.0 plus the trace-propagation and terminal-event replay
# extensions proofessoor integrates with; the exact rev keeps builds reproducible.
zkboost-client = { git = "https://github.com/eth-act/zkboost", rev = "ce4390d4e5ce0a6e64323c00229a67e31d7ade40" }
zkboost-types = { git = "https://github.com/eth-act/zkboost", rev = "ce4390d4e5ce0a6e64323c00229a67e31d7ade40" }

[dev-dependencies]
# In-memory span exporter for the otel-gated span tests; compiled for tests
# only.
opentelemetry_sdk = { version = "0.31", features = ["testing"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
future_not_send = "warn"
large_futures = "warn"
inefficient_to_string = "warn"
string_add = "warn"
module_name_repetitions = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
